name: Update vendored skills

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-vendored
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh vendored skills from upstream
        run: bash ./update-vendored.sh

      - name: Open pull request when updates are available
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-vendored-skills
          delete-branch: true
          commit-message: "chore: update vendored skills"
          title: "chore: update vendored skills"
          body: |
            Refreshes every skill listed in `vendored-sources.txt` from its upstream repository.

            Please review the skill changes before merging.

      - name: Merge update pull request automatically
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
